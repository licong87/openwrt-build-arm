name: 京东云亚瑟（无 Wi-Fi）

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * 1'

permissions: write-all

jobs:
  build:
    name: 京东云亚瑟（无 Wi-Fi）
    uses: ./.github/workflows/core.yml
    with:
      TARGET: ipq60xx-libWrt-nowifi-ress01
      REPO_SOURCE: LibWrt
      REPO_URL: https://github.com/LiBwrt/openwrt-6.x
      REPO_BRANCH: 25.12-nss
      CONFIG_FILE: ./config/arm/nowifi-ress01.config
